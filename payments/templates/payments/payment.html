{% include "posts/navbar.html" %}
{% load webpush_notifications %} 
{% load static %}

<form action="{% form.paypal_form.target %}" method="post">
    {% csrf_token %}
    {{ form.paypal_form.as_p }}
    <input type="submit" value="Pay with PayPal">
</form>

<form action="https://www.sandbox.paypal.com/cgi-bin/webscr" method="post">
    <input type="hidden" name="business" value="cjefferys@mocs.flsouthern.edu">
    <input type="hidden" name="cmd" value="_xclick">
    <input type="hidden" name="item_name" value={post.title}>
    <input type="hidden" name="amount" value={post.price}>
    <input type="hidden" name="currency_code" value="USD">
    <input type="hidden" name="notify_url" value="/paypal/">
    <input type="hidden" name="return" value="/complete">
    <input type="hidden" name="batch" value={post.id}>
    <input type="submit" value="Pay with PayPal">
  </form>
