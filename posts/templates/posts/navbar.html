<html>

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'posts/style.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>MocketPlace</title>
</head> 
<body> 
  <header> 
        <div>
            <a href="/">
                <img src="{% static 'posts/images/logo.jpg' %}" alt="Logo" class="logo">
            </a>
        </div>
        {% if request.path == '/' %}
            <div class="searchNav">
                <form method="GET" action="{% url 'home' %}" >
                    <input class="searchBar" type="text" name="q" placeholder="Search posts..." value="{{ request.GET.q|default:'' }}">
                </form>
            </div>
        {% endif %}
        <nav>
            <ul class="navbar-links">
                {% if user.is_authenticated %}
            <li><a href="{% url 'accounts:profile' %}" class="navbar-button">
                    Welcome, {{ user.first_name }} {{ user.last_name }}!
                    </a></li>

                <li><a href="{% url 'accounts:logout' %}" class="navbar-button">LOGOUT</a></li>
                <li><a href="{% url 'notifications:notifications_list' %}" class="navbar-button"><i class="bi bi-bell"></i></a></li>
                {% else %}
                <li><a href="{% url 'accounts:login' %}">LOGIN</a></li>
                <li><a href="{% url 'accounts:register' %}">REGISTER</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
</body>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
